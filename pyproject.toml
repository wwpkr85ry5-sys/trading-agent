[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-agent"
version = "0.1.0"
description = "ML-based trading agent with real market data pipeline and backtesting utilities"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "scikit-learn",
    "yfinance",
]

[project.scripts]
trading-agent = "cli:main"
trading-agent-backtest = "examples.backtest_real_data:main"
trading-agent-portfolio = "examples.multi_symbol_portfolio:main"

[tool.setuptools]
py-modules = ["trading_agent", "market_data", "data_loader", "cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
